name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git diff --check
      - run: pnpm lint:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter crewcmd run test
      - run: pnpm --filter crewcmd run smoke
      - run: pnpm build
      - run: pnpm release:check

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --config=playwright.smoke.config.ts
      - name: Upload onboarding smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-smoke-diagnostics
          path: test-results/onboarding-smoke
          if-no-files-found: warn
          retention-days: 7
