<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CrewCmd Mobile</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell" hidden>
      <header class="brand-header">
        <div class="brand-mark" aria-hidden="true">
          <span class="brand-c">C</span>
          <span class="brand-chevron">&gt;</span>
          <span class="brand-line"></span>
        </div>
        <p id="app-name" class="eyebrow">CrewCmd Mobile</p>
      </header>

      <main class="connect-card">
        <div class="connect-copy">
          <p class="panel-label">Deployment</p>
          <h1 id="org-name">Not configured</h1>
          <p id="connection-status" class="status-line">Paste a signed bootstrap link from your CrewCmd admin.</p>
        </div>

        <dl class="detail-grid">
          <div>
            <dt>Status</dt>
            <dd id="environment-chip">Unconfigured</dd>
          </div>
          <div>
            <dt>Server</dt>
            <dd id="server-url">No server selected</dd>
          </div>
          <div>
            <dt>Profile</dt>
            <dd id="profile-id">Not configured</dd>
          </div>
          <div class="hidden">
            <dt>Reachability</dt>
            <dd id="network-hint">Waiting for bootstrap</dd>
          </div>
        </dl>

        <section id="bootstrap-panel" class="bootstrap-panel">
          <label class="field">
            <span>Bootstrap link or JSON payload</span>
            <textarea id="bootstrap-input" rows="3" placeholder="crewcmd://bootstrap?payload=..."></textarea>
          </label>
          <button id="apply-bootstrap" class="primary-button" type="button">Connect CrewCmd</button>
        </section>

        <section id="configured-panel" class="configured-panel hidden">
          <button id="open-crewcmd" class="primary-button" type="button">Open CrewCmd</button>
          <button id="clear-bootstrap" class="ghost-button" type="button">Reset connection</button>
        </section>

        <div class="hidden">
          <span id="lock-chip">Multi-server</span>
          <span id="support-line">Support: support@example.com</span>
          <button id="test-connection" type="button">Test connection</button>
          <section id="manual-panel">
            <input id="manual-server-input" type="url" />
            <button id="apply-manual-server" type="button">Save override</button>
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
